{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper glass-container" style="text-align:center;">
    <img src="{{ url_for('static', filename='logo.png') }}?v=2" alt="Logo"
        style="width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 0 35px rgba(255, 100, 60, 0.5); margin-bottom: 1.5rem; margin-top: 1rem;">
    <h2 style="margin-top: 0; margin-bottom: 1.5rem;">Login to Stock Pulse</h2>
    <form method="POST" style="text-align:center;">
        <div class="form-group" style="text-align: center;">
            <label>Username</label>
            <input type="text" name="username" required autocomplete="username" style="text-align: center;">
        </div>
        <div class="form-group" style="text-align: center;">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password" style="text-align: center;">
        </div>
        <button type="submit" class="btn" style="width:100%; margin-top:1rem;">Login</button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}"
            style="color:var(--accent-color); text-decoration:none;">Register here</a>
    </p>
</div>
{% endblock %}
