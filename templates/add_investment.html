{% extends "base.html" %}
{% block content %}
<div class="glass-container" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-top:0;">Add New Investment</h2>
    <p style="color:var(--text-secondary); margin-bottom:2rem;">Track a new stock, crypto or asset in your portfolio.</p>

    <form method="post">
        <div class="form-group">
            <label>Symbol (e.g., AAPL, TSLA, BTC-USD)</label>
            <input type="text" name="symbol" required placeholder="Enter asset symbol">
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Technology">Technology</option>
                <option value="Finance">Finance</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Energy">Energy</option>
                <option value="Crypto">Crypto</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" step="any" min="0.000001" name="quantity" required placeholder="e.g. 10.5">
        </div>

        <div class="form-group">
            <label>Buy Price</label>
            <input type="number" step="any" min="0.01" name="buy_price" required placeholder="e.g. 150.00">
        </div>

        <div style="display:flex; gap:1rem; margin-top:2rem;">
            <button type="submit" class="btn" style="flex:1;">Add Investment</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline" style="flex:1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
